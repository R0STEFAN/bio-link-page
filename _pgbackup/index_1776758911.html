<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bio link page тату майстра Анни Сухан із Запоріжжя."
    />
    <title>Анна Сухан | Тату майстер у Запоріжжі</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="bio-page">
      <section class="profile" aria-labelledby="profile-title">
        <div class="photo-panel" aria-hidden="true"></div>

        <div class="content">
          <p class="eyebrow">Запоріжжя · tattoo artist</p>
          <h1 id="profile-title">Анна Сухан</h1>
          <p class="intro">
            Авторські татуювання, консультація та запис у темпі, де ескіз
            народжується уважно до людини.
          </p>

          <nav class="link-list" aria-label="Контакти та посилання">
            <a class="link-item primary" href="">
              <span>
                <span class="link-title">Записатися на сеанс</span>
              </span>
              <i data-lucide="send" aria-hidden="true"></i>
            </a>

            <a class="link-item" href="">
              <span>
                <span class="link-title">Instagram</span>
              </span>
              <i data-lucide="instagram" aria-hidden="true"></i>
            </a>

            <a class="link-item" href="">
              <span>
                <span class="link-title">Telegram</span>
              </span>
              <i data-lucide="message-circle" aria-hidden="true"></i>
            </a>

            <a class="link-item" href="">
              <span>
                <span class="link-title">Viber / WhatsApp</span>
              </span>
              <i data-lucide="messages-square" aria-hidden="true"></i>
            </a>

            <a class="link-item" href="">
              <span>
                <span class="link-title">Сайт</span>
              </span>
              <i data-lucide="globe-2" aria-hidden="true"></i>
            </a>

            <a class="link-item accent" href="">
              <span>
                <span class="link-title">Роботи</span>
              </span>
              <i data-lucide="images" aria-hidden="true"></i>
            </a>

            <a class="link-item" href="">
              <span>
                <span class="link-title">Телефон</span>
              </span>
              <i data-lucide="phone" aria-hidden="true"></i>
            </a>
          </nav>

          <div class="details" aria-label="Коротка інформація">
            <span>Індивідуальний ескіз</span>
            <span>Стерильні матеріали</span>
            <span>Консультація перед записом</span>
          </div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      window.lucide?.createIcons({
        attrs: {
          "stroke-width": 1.8
        }
      });
    </script>
  </body>
</html>
